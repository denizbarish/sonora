name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    name: Build the disk image
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_26.3.app

      - name: Test
        run: swift test --parallel

      # XcodeGen is not preinstalled on the runner image, and make-dmg.sh calls
      # it. Without this the job dies at that line, loudly, which is better
      # than shipping a bad image but still a red release.
      - name: Install XcodeGen
        run: brew install xcodegen

      # No signing identity on the runner, so the app inside is ad hoc signed.
      # That is enough for the audio permission, which macOS keys to the
      # binary's hash, and not enough for Gatekeeper, which the README covers.
      - name: Build the disk image
        run: ./Scripts/make-dmg.sh "${GITHUB_REF_NAME#v}"

      - name: Attach it to the release
        # Pinned to a commit, not a tag: this job has contents: write, and a
        # mutable tag hands whoever can move it write access to the release.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: Sonora-*.dmg
          draft: true
          generate_release_notes: true
