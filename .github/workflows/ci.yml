name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift package tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version the project is developed against. macos-15 was
      # tried first and carries Swift 6.1, which cannot read this manifest.
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_26.3.app

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --parallel

      # EqualizerChain does unchecked pointer arithmetic over a flat filter
      # buffer. An off-by-one there is silent memory corruption in release
      # builds and cannot be caught behaviourally, so the suite also runs under
      # AddressSanitizer.
      # Time-boxed on purpose. An earlier run built cleanly under the
      # sanitizer and then produced no output for six hours until GitHub's job
      # timeout killed it, so this step must fail fast rather than burn a
      # runner. Parallel execution is off because the sanitizer runtime and the
      # test runner's process handling are the suspected cause of the hang.
      - name: Test under AddressSanitizer
        timeout-minutes: 20
        run: swift test --sanitize=address --no-parallel
