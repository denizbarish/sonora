name: Sonora
options:
  bundleIdPrefix: com.sonora
  deploymentTarget:
    macOS: "14.4"
  createIntermediateGroups: true

packages:
  SonoraCore:
    path: ..

targets:
  Sonora:
    type: application
    platform: macOS
    sources:
      - path: Sonora
    dependencies:
      - package: SonoraCore
        product: SonoraDSP
      - package: SonoraCore
        product: SonoraProfiles
      - package: SonoraCore
        product: SonoraPersistence
    # No `info:` or `entitlements:` keys on purpose. Those tell XcodeGen to
    # GENERATE those files, overwriting the hand-written ones on every run, and
    # the generated Info.plist drops NSAudioCaptureUsageDescription, which is
    # the key the whole audio permission depends on. The build settings below
    # point at the committed files instead.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sonora.Sonora
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Sonora/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Sonora/Sonora.entitlements
        # Empty unless SONORA_DEVELOPMENT_TEAM is exported when generating.
        # Without a team Xcode falls back to ad hoc signing and silently turns
        # Hardened Runtime off, and an ad hoc binary can never hold the system
        # audio permission, because TCC keys that record to the signing
        # identity. See App/README.md.
        DEVELOPMENT_TEAM: $(SONORA_DEVELOPMENT_TEAM)
